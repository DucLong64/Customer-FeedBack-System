<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Feedback Dashboard</title>
    <!-- Thêm Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>

<div class="container my-4">
    <h2 class="mb-4">Feedback Dashboard</h2>

    <div class="row gx-4">
        <!-- Danh sách feedback -->
        <div class="col-md-7">
            <h3>Your Feedbacks</h3>
            <div class="table-responsive">
                <table class="table table-bordered table-hover align-middle">
                    <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Content</th>
                        <th>Rating</th>
                        <th>Type</th>
                        <th>Status</th>
                        <th>Created At</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="fb : ${feedbackPage.content}">
                        <td th:text="${fb.id}"></td>
                        <td th:text="${fb.content}"></td>
                        <td th:text="${fb.rating}"></td>
                        <td th:text="${fb.feedbackType}"></td>
                        <td th:text="${fb.feedbackStatus}"></td>
                        <td th:text="${#dates.format(fb.created_at, 'dd/MM/yyyy HH:mm')}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="d-flex justify-content-between align-items-center mt-3">
                <div>
                    Page: <span th:text="${currentPage + 1}"></span> / <span th:text="${totalPages}"></span>
                </div>
                <div>
                    <a th:if="${currentPage > 0}"
                       th:href="@{/home(page=${currentPage - 1}, size=10)}"
                       class="btn btn-outline-primary btn-sm me-2">Previous</a>
                    <a th:if="${currentPage + 1 < totalPages}"
                       th:href="@{/home(page=${currentPage + 1}, size=10)}"
                       class="btn btn-outline-primary btn-sm">Next</a>
                </div>
            </div>
        </div>

        <!-- Form tạo feedback -->
        <div class="col-md-5">
            <h3>Create New Feedback</h3>
            <form th:action="@{/home}" th:object="${newFeedback}" method="post">
                <div class="mb-3">
                    <label for="content" class="form-label">Content:</label>
                    <textarea id="content" th:field="*{content}" required class="form-control" rows="4"></textarea>
                </div>

                <div class="mb-3">
                    <label for="rating" class="form-label">Rating (1-5):</label>
                    <input type="number" id="rating" th:field="*{rating}" min="1" max="5" required class="form-control"/>
                </div>

                <div class="mb-3">
                    <label for="feedbackType" class="form-label">Feedback Type:</label>
                    <select id="feedbackType" th:field="*{feedbackType}" required class="form-select">
                        <option th:each="type : ${feedbackTypes}"
                                th:value="${type}"
                                th:text="${type}"></option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary">Submit</button>
            </form>
        </div>
    </div>
</div>

<!-- Thêm Bootstrap JS (tuỳ chọn nếu dùng JS của Bootstrap) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
