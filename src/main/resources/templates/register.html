<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<div class="container mt-5">
  <h2>Register</h2>

  <!-- Hiển thị thông báo lỗi hoặc thành công -->
  <div th:if="${message}" class="alert" th:classappend="${message.contains('failed') ? 'alert-danger' : 'alert-success'}">
    <span th:text="${message}"></span>
  </div>

  <!-- Form đăng ký -->
  <form th:action="@{/auth/register}" th:object="${registerDto}" method="post" class="mt-4">
    <div class="mb-3">
      <label for="username" class="form-label">Username</label>
      <input type="text" th:field="*{username}" class="form-control" id="username" placeholder="Enter username" required/>
    </div>
    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input type="email" th:field="*{email}" class="form-control" id="email" placeholder="Enter email" required/>
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input type="password" th:field="*{password}" class="form-control" id="password" placeholder="Enter password" required/>
    </div>
    <button type="submit" class="btn btn-primary">Register</button>
    <a th:href="@{/auth/login}" class="btn btn-link">Already have an account? Login</a>
  </form>
</div>
</body>
</html>
