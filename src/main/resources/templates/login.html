<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<div class="container mt-5">
    <h2>Login</h2>

    <!-- Hiển thị thông báo lỗi hoặc thành công -->
    <div th:if="${message}" class="alert" th:classappend="${message.contains('failed') ? 'alert-danger' : 'alert-success'}">
        <span th:text="${message}"></span>
    </div>

    <!-- Hiển thị thông báo đăng xuất -->
    <div th:if="${param.logout}" class="alert alert-success">
        You have been logged out successfully.
    </div>

    <!-- Form đăng nhập -->
    <form th:action="@{/auth/login}" th:object="${loginDto}" method="post" class="mt-4">
        <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" th:field="*{username}" class="form-control" id="username" placeholder="Enter username" required/>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" th:field="*{password}" class="form-control" id="password" placeholder="Enter password" required/>
        </div>
        <button type="submit" class="btn btn-primary">Login</button>
        <a th:href="@{/auth/register}" class="btn btn-link">Don't have an account? Register</a>
    </form>
</div>
</body>
</html>
