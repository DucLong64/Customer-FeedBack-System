<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<div class="container mt-5">
    <h2>Admin Dashboard - Feedback Management</h2>

    <!-- Form tìm kiếm -->
    <form th:action="@{/admin/dashboard}" method="get" class="mb-4">
        <div class="row g-2">
            <div class="col">
                <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Search by content"/>
            </div>
            <div class="col">
                <select name="status" class="form-control">
                    <option value="">All Status</option>
                    <option th:each="status : ${feedbackStatuses}"
                            th:value="${status}"
                            th:text="${status}"
                            th:selected="${status} == ${status}"></option>
                </select>
            </div>
            <div class="col">
                <input type="number" name="userId" th:value="${userId}" class="form-control" placeholder="User ID"/>
            </div>
            <div class="col">
                <select name="type" class="form-control">
                    <option value="">All Types</option>
                    <option th:each="type : ${feedbackTypes}"
                            th:value="${type}"
                            th:text="${type}"
                            th:selected="${type} == ${type}"></option>
                </select>
            </div>
            <div class="col">
                <button type="submit" class="btn btn-primary">Search</button>
            </div>
        </div>
        <input type="hidden" name="page" th:value="${currentPage}"/>
        <input type="hidden" name="size" th:value="${pageSize}"/>
    </form>

    <!-- Bảng hiển thị phản hồi -->
    <table class="table table-bordered">
        <thead>
        <tr>
            <th>ID</th>
            <th>Content</th>
            <th>Rating</th>
            <th>Type</th>
            <th>Status</th>
            <th>User ID</th>
            <th>Created At</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="feedback : ${feedbacks.content}">
            <td th:text="${feedback.id}"></td>
            <td th:text="${feedback.content}"></td>
            <td th:text="${feedback.rating}"></td>
            <td th:text="${feedback.feedbackType}"></td>
            <td th:text="${feedback.feedbackStatus}"></td>
            <td th:text="${feedback.user.id}"></td>
            <td th:text="${#dates.format(feedback.created_at, 'yyyy-MM-dd HH:mm:ss')}"></td>
            <td>
                <form th:action="@{/admin/feedbacks/approve/{id}(id=${feedback.id})}" method="post" class="d-inline">
                    <input type="hidden" name="page" th:value="${currentPage}"/>
                    <input type="hidden" name="size" th:value="${pageSize}"/>
                    <input type="hidden" name="keyword" th:value="${keyword}"/>
                    <input type="hidden" name="status" th:value="${status}"/>
                    <input type="hidden" name="userId" th:value="${userId}"/>
                    <input type="hidden" name="type" th:value="${type}"/>
                    <select name="status" class="form-select d-inline w-auto">
                        <option th:each="statusItem : ${feedbackStatuses}"
                                th:value="${statusItem}"
                                th:text="${statusItem}"
                                th:selected="${statusItem} == ${feedback.feedbackStatus}"></option>
                    </select>
                    <button type="submit" class="btn btn-sm btn-primary">Update</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <!-- Phân trang -->
    <nav th:if="${feedbacks.totalPages > 1}">
        <ul class="pagination">
            <li class="page-item" th:classappend="${feedbacks.first} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/dashboard(page=${feedbacks.number - 1}, size=${pageSize}, keyword=${keyword}, status=${status}, userId=${userId}, type=${type})}">Previous</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, feedbacks.totalPages - 1)}"
                th:classappend="${i} == ${feedbacks.number} ? 'active'">
                <a class="page-link" th:href="@{/admin/dashboard(page=${i}, size=${pageSize}, keyword=${keyword}, status=${status}, userId=${userId}, type=${type})}" th:text="${i + 1}"></a>
            </li>
            <li class="page-item" th:classappend="${feedbacks.last} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/dashboard(page=${feedbacks.number + 1}, size=${pageSize}, keyword=${keyword}, status=${status}, userId=${userId}, type=${type})}">Next</a>
            </li>
        </ul>
    </nav>

    <!-- Nút đăng xuất -->
    <a th:href="@{/auth/logout}" class="btn btn-danger mt-3">Logout</a>
</div>
</body>
</html>
